name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore release signing key
        env:
          KEYSTORE_B64_PART1: ${{ secrets.KEYSTORE_B64_PART1 }}
          KEYSTORE_B64_PART2: ${{ secrets.KEYSTORE_B64_PART2 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64_PART1" ] || [ -z "$KEYSTORE_B64_PART2" ]; then
            echo "KEYSTORE_B64_PART1 / KEYSTORE_B64_PART2 secret is missing"
            exit 1
          fi
          printf '%s%s' "$KEYSTORE_B64_PART1" "$KEYSTORE_B64_PART2" | tr -d ' \r\n' | base64 -d > android/app/kiura-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kiura-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Verify signing key (fails early with a clear message)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ls -l android/app/kiura-release.jks
          sha256sum android/app/kiura-release.jks
          echo "f97c7bafc028a73295ff31224aecca68245adefa1a78f8a118b8876fa5d77bec  android/app/kiura-release.jks" | sha256sum -c - || { echo "Keystore secrets are incomplete or wrong (expected size 2405 bytes)"; exit 1; }
          keytool -list -keystore android/app/kiura-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - run: flutter pub get

      # the build number (Android versionCode) grows with every run, so updates install over old versions
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
